services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: car_health_test
    ports:
      - "3307:3306"
    volumes:
      - ./internal/db/migrations/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcar_health_test"]
      interval: 5s
      timeout: 5s
      retries: 20
